<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 80px; background: #f5f5f5; }
        .loader { border: 4px solid #ddd; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Sedang mengalihkan...</p>

    <script>
        const path = window.location.pathname;
        const parts = path.split('/');
        const code = parts[parts.length - 1].toLowerCase();
        const repoName = 'login';

        if (!code || code === repoName || code === '') {
            document.body.innerHTML = '<h1>🔗 Shortlink Service</h1><p>Silakan tambahkan kode link di akhir URL.</p>';
        } else {
            fetch('links.json')
                .then(response => response.json())
                .then(data => {
                    if (data[code]) {
                        window.location.href = data[code];
                    } else {
                        document.body.innerHTML = '<h1>❌ 404</h1><p>Kode <b>' + code + '</b> tidak ditemukan.</p>';
                    }
                })
                .catch(error => {
                    document.body.innerHTML = '<h1>️ Error</h1><p>Gagal memuat data link.</p>';
                });
        }
    </script>
</body>
</html>
